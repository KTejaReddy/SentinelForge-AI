version: "3.9"

# SentinelForge AI — Multi-container security lab
# Architecture:
#   - Backend: FastAPI controller
#   - Frontend: React/Vite UI
#   - Security Runner: Contains all security tools (Semgrep, Trivy, Gitleaks, Nuclei, ffuf, Bandit)
#   - Browser Runner: Playwright + Chromium for browser testing
#   - ZAP: OWASP ZAP for dynamic web testing
#   - Target: Isolated container for each uploaded project

services:
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    env_file:
      - .env
    environment:
      - DOCKER_ENABLED=true
      - DATABASE_URL=sqlite:////data/sentinelforge.db
      - SECURITY_RUNNER_IMAGE=sentinelforge/security-runner:latest
      - BROWSER_RUNNER_IMAGE=sentinelforge/browser-runner:latest
      - ZAP_IMAGE=ghcr.io/zaproxy/zaproxy:latest
    volumes:
      - ./data:/data
      - ./workspaces:/workspaces
      - ./scans:/scans
      - ./reports:/reports
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    depends_on:
      - backend
    ports:
      - "5173:80"
    environment:
      - VITE_API_BASE=http://localhost:8000

  security-runner:
    build:
      context: .
      dockerfile: docker/security-runner/Dockerfile
    image: sentinelforge/security-runner:latest
    volumes:
      - ./workspaces:/workspace
    # No ports exposed - runs on-demand via Docker API

  browser-runner:
    build:
      context: .
      dockerfile: docker/browser-runner/Dockerfile
    image: sentinelforge/browser-runner:latest
    volumes:
      - ./workspaces:/workspace
    # No ports exposed - runs on-demand via Docker API

  # ZAP is used on-demand, not as a persistent service
  # The backend will run: docker run --rm --network host ghcr.io/zaproxy/zaproxy ...
